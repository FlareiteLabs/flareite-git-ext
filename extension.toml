[[menus]]
location = "view/title"
view = "changes"
command = "ferrite.git.viewAsTree"
group = "3_view"
when = "!tree"

[[menus]]
location = "view/title"
view = "changes"
command = "ferrite.git.viewAsList"
group = "3_view"
when = "tree"

# The Changes view's groups.
[[menus]]
location = "view/item"
view = "changes"
contexts = ["staged-group"]
command = "ferrite.git.unstageAll"
inline = true
icon = "remove"

[[menus]]
location = "view/item"
view = "changes"
contexts = ["changes-group"]
command = "ferrite.git.discardAll"
inline = true
icon = "undo"

[[menus]]
location = "view/item"
view = "changes"
contexts = ["changes-group"]
command = "ferrite.git.stageAll"
inline = true
icon = "add"

# The Changes view's files.
[[menus]]
location = "view/item"
view = "changes"
contexts = ["staged", "changed", "untracked", "merge"]
command = "ferrite.git.open"
inline = true
icon = "file"

[[menus]]
location = "view/item"
view = "changes"
contexts = ["changed", "untracked"]
command = "ferrite.git.discard"
inline = true
icon = "undo"

[[menus]]
location = "view/item"
view = "changes"
contexts = ["changed", "untracked", "merge"]
command = "ferrite.git.stage"
inline = true
icon = "add"

[[menus]]
location = "view/item"
view = "changes"
contexts = ["staged"]
command = "ferrite.git.unstage"
inline = true
icon = "remove"

[[menus]]
location = "view/item"
view = "changes"
contexts = ["changed"]
command = "ferrite.git.openChange"
group = "1_open"

[[menus]]
location = "view/item"
view = "changes"
contexts = ["staged"]
command = "ferrite.git.openStagedChange"
group = "1_open"

[[menus]]
location = "view/item"
view = "changes"
contexts = ["staged", "changed", "untracked", "merge"]
command = "ferrite.git.open"
group = "1_open"

[[menus]]
location = "view/item"
view = "changes"
contexts = ["changed", "untracked", "merge"]
command = "ferrite.git.stage"
group = "2_modify"

[[menus]]
location = "view/item"
view = "changes"
contexts = ["staged"]
command = "ferrite.git.unstage"
group = "2_modify"

[[menus]]
location = "view/item"
view = "changes"
contexts = ["changed", "untracked"]
command = "ferrite.git.discard"
group = "2_modify"

# The Commits view.
[[menus]]
location = "view/title"
view = "commits"
command = "ferrite.git.refresh"
inline = true
icon = "refresh"
when = "repository"

[[menus]]
location = "view/item"
view = "commits"
contexts = ["commit"]
command = "ferrite.git.commitDetails"

[[menus]]
location = "view/item"
view = "commits"
contexts = ["commit-file"]
command = "ferrite.git.openCommitFile"
inline = true
icon = "file"

[[menus]]
location = "view/item"
view = "commits"
contexts = ["commit-file"]
command = "ferrite.git.openCommitChange"
group = "1_open"

[[menus]]
location = "view/item"
view = "commits"
contexts = ["commit-file"]
command = "ferrite.git.openCommitFile"
group = "1_open"

# The editor.
[[menus]]
location = "editor/context"
command = "ferrite.git.stageSelectedRanges"
group = "9_git"

# The explorer's files.
[[menus]]
location = "explorer/context"
targets = ["files"]
command = "ferrite.git.openFileChanges"
group = "7_git"

[[status_items]]
id = "branch"
alignment = "left"
priority = 100

[configuration.explorer_marks]
type = "boolean"
default = true
description = "Show the Git status of files in the explorer: their color and a letter (M, A, R, U, or ! for a conflict). Deleted files are not in the explorer, so they are not marked."

[configuration.smart_commit]
type = "string"
default = "ask"
choices = ["ask", "always", "never"]
description = "When you commit with no staged changes: ask whether to stage all changes and commit them, always do, or never do."

[configuration.discard_untracked]
type = "string"
default = "trash"
choices = ["trash", "delete"]
description = "Discarding an untracked file deletes it: move it to the Recycle Bin (or Trash), where you can restore it, or delete it permanently."

[configuration.changes_view]
type = "string"
default = "list"
choices = ["list", "tree"]
description = "Show changed files as a list (with their folders), or as a tree of folders."

# The explorer's colors. Themes and [workbench.colors] can change them, as
# "ferrite.git.modified" and so on.
[colors.modified]
description = "Files with changes"
dark = "#e2c08d"
light = "#895503"

[colors.added]
description = "Files added to the index"
dark = "#81b88b"
light = "#587c0c"

[colors.deleted]
description = "Deleted files"
dark = "#c74e39"
light = "#ad0707"

[colors.renamed]
description = "Renamed files"
dark = "#73c991"
light = "#007100"

[colors.untracked]
description = "Files Git doesn't track"
dark = "#73c991"
light = "#007100"

[colors.conflict]
description = "Files with merge conflicts"
dark = "#e4676b"
light = "#ad0707"
