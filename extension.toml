id = "flareite.git"
name = "Git"
version = "0.5.0"
description = "Source control with Git: stage, commit, and browse history; see changes side by side; file status in the explorer; the current branch."
author = "Flareite"
icon = "icon.svg"
api_version = "1"
entrypoint = "target/wasm32-unknown-unknown/release/git.wasm"
activation = ["on-startup"]
on_folder_changed = "flareite.git.folderChanged"
on_active_file_changed = "flareite.git.activeFileChanged"
# The cursor's line, for blame.
on_selection_changed = "flareite.git.selectionChanged"

[permissions]
# The file of the active document, for Open Changes; and conflicts in open
# documents, to mark them.
documents_read = true
# Resolving a conflict (Accept Current Change and the like) edits its file.
documents_write = true
# Watching the open folder for changes.
files_read = true
# Deleting untracked files when their changes are discarded.
files_write = true
processes = true

# Git can ask for a username and password, or SSH for a key's
# passphrase: Flareite asks you.
[[programs]]
name = "git"
askpass = true

# Versions of files in HEAD, the index, and commits, for diff tabs.
[[text_providers]]
scheme = "git"
command = "flareite.git.provide"

# Lines changed from the index, marked beside the text as it's edited.
[quick_diff]
original = "flareite.git.original"
apply = "flareite.git.stageChanges"
apply_title = "Stage"

# The Source Control view: changes, with a commit message box, and commits.
[[view_containers]]
id = "scm"
title = "Source Control"
icon = "source-control"

# Shown when there's more than one repository: choose the one the views
# below show.
[[views]]
id = "repositories"
title = "Repositories"
container = "scm"
hidden = true

[[views]]
id = "changes"
title = "Changes"
container = "scm"
input = { placeholder = "Message (Ctrl+Enter to commit)", command = "flareite.git.commit" }

[[views]]
id = "commits"
title = "Commits"
container = "scm"
on_expand = "flareite.git.expandCommit"

[[views]]
id = "stashes"
title = "Stashes"
container = "scm"
on_expand = "flareite.git.expandStash"

[[views]]
id = "file-history"
title = "File History"
container = "scm"

[[previews]]
id = "commit"
icon = "history"

