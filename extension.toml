alignment = "left"
priority = 100

# How far the branch is behind and ahead: click to sync (or to publish it).
[[status_items]]
id = "sync"
alignment = "left"
priority = 99

[configuration.explorer_marks]
type = "boolean"
default = true
description = "Show the Git status of files in the explorer: their color and a letter (M, A, R, U, or ! for a conflict). Deleted files are not in the explorer, so they are not marked."

[configuration.smart_commit]
type = "string"
default = "ask"
choices = ["ask", "always", "never"]
description = "When you commit with no staged changes: ask whether to stage all changes and commit them, always do, or never do."

[configuration.discard_untracked]
type = "string"
default = "trash"
choices = ["trash", "delete"]
description = "Discarding an untracked file deletes it: move it to the Recycle Bin (or Trash), where you can restore it, or delete it permanently."

[configuration.changes_view]
type = "string"
default = "list"
choices = ["list", "tree"]
description = "Show changed files as a list (with their folders), or as a tree of folders."

[configuration.autofetch]
type = "boolean"
default = false
description = "Fetch from the remotes in the background, every autofetch_period seconds."

[configuration.autofetch_period]
type = "integer"
default = 180
minimum = 30
description = "How often to fetch in the background, in seconds, when autofetch is on."

[configuration.confirm_sync]
type = "boolean"
default = true
description = "Ask before syncing (pulling, then pushing) with the branch's upstream."

# The explorer's colors. Themes and [workbench.colors] can change them, as
# "ferrite.git.modified" and so on.
[colors.modified]
description = "Files with changes"
dark = "#e2c08d"
light = "#895503"

[colors.added]
description = "Files added to the index"
dark = "#81b88b"
light = "#587c0c"

[colors.deleted]
description = "Deleted files"
dark = "#c74e39"
light = "#ad0707"

[colors.renamed]
description = "Renamed files"
dark = "#73c991"
light = "#007100"

[colors.untracked]
description = "Files Git doesn't track"
dark = "#73c991"
light = "#007100"

[colors.conflict]
description = "Files with merge conflicts"
dark = "#e4676b"
light = "#ad0707"
