id = "ferrite.git"
name = "Git"
version = "0.3.0"
description = "Source control with Git: stage, commit, and browse history; see changes side by side; file status in the explorer; the current branch."
author = "Ferrite"
icon = "icon.svg"
api_version = "1"
entrypoint = "../target/wasm32-unknown-unknown/release/git.wasm"
activation = ["on-startup"]
on_folder_changed = "ferrite.git.folderChanged"

[permissions]
# The file of the active document, for Open Changes.
documents_read = true
# Watching the open folder for changes.
files_read = true
# Deleting untracked files when their changes are discarded.
files_write = true
processes = true

[[programs]]
name = "git"

# Versions of files in HEAD, the index, and commits, for diff tabs.
[[text_providers]]
scheme = "git"
command = "ferrite.git.provide"

# Lines changed from the index, marked beside the text as it's edited.
[quick_diff]
original = "ferrite.git.original"
apply = "ferrite.git.stageChanges"
apply_title = "Stage"

# The Source Control view: changes, with a commit message box, and commits.
[[view_containers]]
id = "scm"
title = "Source Control"
icon = "source-control"

[[views]]
id = "changes"
title = "Changes"
container = "scm"
input = { placeholder = "Message (Ctrl+Enter to commit)", command = "ferrite.git.commit" }

[[views]]
id = "commits"
title = "Commits"
container = "scm"
on_expand = "ferrite.git.expandCommit"

[[previews]]
id = "commit"
icon = "history"

# Commands from the palette.
[[commands]]
id = "ferrite.git.refresh"
title = "Refresh"

[[commands]]
id = "ferrite.git.init"
title = "Initialize Repository"

[[commands]]
id = "ferrite.git.commit"
title = "Commit"

[[commands]]
id = "ferrite.git.commitStaged"
title = "Commit Staged"

[[commands]]
id = "ferrite.git.commitAll"
title = "Commit All"

[[commands]]
id = "ferrite.git.commitAmend"
title = "Commit (Amend)"

[[commands]]
id = "ferrite.git.undoCommit"
title = "Undo Last Commit"

[[commands]]
id = "ferrite.git.stageAll"
title = "Stage All Changes"

[[commands]]
id = "ferrite.git.unstageAll"
title = "Unstage All Changes"

[[commands]]
id = "ferrite.git.discardAll"
title = "Discard All Changes"

[[commands]]
id = "ferrite.git.openFileChanges"
title = "Open Changes"

[[commands]]
id = "ferrite.git.stageSelectedRanges"
title = "Stage Selected Ranges"

# Commands for the views' items and buttons.
[[commands]]
id = "ferrite.git.stage"
title = "Stage Changes"
hidden = true

[[commands]]
id = "ferrite.git.unstage"
title = "Unstage Changes"
hidden = true

[[commands]]
id = "ferrite.git.discard"
title = "Discard Changes"
hidden = true

[[commands]]
id = "ferrite.git.open"
title = "Open File"
hidden = true

[[commands]]
id = "ferrite.git.openChange"
title = "Open Changes"
hidden = true

[[commands]]
id = "ferrite.git.openStagedChange"
title = "Open Changes"
hidden = true

[[commands]]
id = "ferrite.git.openCommitChange"
title = "Open Changes"
hidden = true

[[commands]]
id = "ferrite.git.openCommitFile"
title = "Open File"
hidden = true

[[commands]]
id = "ferrite.git.viewAsTree"
title = "View as Tree"
hidden = true

[[commands]]
id = "ferrite.git.viewAsList"
title = "View as List"
hidden = true

[[commands]]
id = "ferrite.git.loadMore"
title = "Load More Commits"
hidden = true

[[commands]]
id = "ferrite.git.commitDetails"
title = "Open Commit Details"
hidden = true

[[commands]]
id = "ferrite.git.trust"
title = "Trust Folder"
hidden = true

# Run by the editor, not the user.
[[commands]]
id = "ferrite.git.folderChanged"
title = "Open Folder Changed"
hidden = true

[[commands]]
id = "ferrite.git.filesChanged"
title = "Files Changed"
hidden = true

[[commands]]
id = "ferrite.git.jobFinished"
title = "Git Finished"
hidden = true

[[commands]]
id = "ferrite.git.answered"
title = "Answered"
hidden = true

[[commands]]
id = "ferrite.git.provide"
title = "Provide a Version"
hidden = true

[[commands]]
id = "ferrite.git.original"
title = "Name a File's Original"
hidden = true

[[commands]]
id = "ferrite.git.stageChanges"
title = "Stage Changes"
hidden = true

[[commands]]
id = "ferrite.git.expandCommit"
title = "List a Commit's Files"
hidden = true

# The Changes view's header.
[[menus]]
location = "view/title"
view = "changes"
command = "ferrite.git.commit"
inline = true
icon = "check"
when = "repository"

[[menus]]
location = "view/title"
view = "changes"
command = "ferrite.git.refresh"
inline = true
icon = "refresh"
when = "repository"

[[menus]]
location = "view/title"
view = "changes"
command = "ferrite.git.commit"
group = "1_commit"
when = "repository"

[[menus]]
location = "view/title"
view = "changes"
command = "ferrite.git.commitStaged"
group = "1_commit"
when = "repository"

[[menus]]
location = "view/title"
view = "changes"
command = "ferrite.git.commitAll"
group = "1_commit"
when = "repository"

[[menus]]
location = "view/title"
view = "changes"
command = "ferrite.git.commitAmend"
group = "1_commit"
when = "repository"

[[menus]]
location = "view/title"
view = "changes"
command = "ferrite.git.undoCommit"
group = "1_commit"
when = "repository"

[[menus]]
location = "view/title"
view = "changes"
command = "ferrite.git.stageAll"
group = "2_changes"
when = "repository"

[[menus]]
location = "view/title"
view = "changes"
command = "ferrite.git.unstageAll"
group = "2_changes"
when = "repository"

[[menus]]
location = "view/title"
view = "changes"
command = "ferrite.git.discardAll"
group = "2_changes"
