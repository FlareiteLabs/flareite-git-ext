[package]
name = "git"
description = "Git for Ferrite: source control in the editor."
version = "0.5.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# The editor's repository, checked out beside this one.
ferrite-extension-api = { path = "../editor/crates/ferrite-extension-api" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
