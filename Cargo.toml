[package]
name = "git"
description = "Git for Flareite: source control in the editor."
version = "0.5.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# The editor's repository, checked out beside this one.
flareite-extension-api = { path = "../editor/crates/flareite-extension-api" }
# Comparing texts, for diff and merge tabs: compiled into the extension.
flareite-diff = { path = "../editor/crates/flareite-diff" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
